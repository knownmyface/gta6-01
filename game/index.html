<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORAL HEAT — Open-World Crime Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a2432;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif; color: #fff; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .panel { background: rgba(8, 12, 20, 0.62); border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 10px; backdrop-filter: blur(2px); }
  /* Mission panel, top-left */
  #missionPanel { position: absolute; top: 14px; left: 14px; padding: 10px 14px; max-width: 380px; }
  #missionTitle { font-size: 17px; font-weight: 800; letter-spacing: 0.5px; color: #ffd23e; }
  #missionSub { font-size: 13px; color: #e8e8e8; margin-top: 3px; line-height: 1.35; }
  #missionCash { font-size: 11px; color: #9fd8ff; margin-top: 5px; letter-spacing: 1px; }
  /* Wanted + cash + health, top-right */
  #wantedBox { position: absolute; top: 14px; right: 14px; padding: 10px 14px; text-align: right; min-width: 170px; }
  #stars { font-size: 22px; letter-spacing: 3px; color: #ffd23e; line-height: 1; }
  #cashLine { font-size: 20px; font-weight: 800; color: #7cfc66; margin-top: 4px; }
  #healthBar { width: 150px; height: 8px; background: rgba(255,255,255,0.18); border-radius: 4px;
    margin-top: 6px; margin-left: auto; overflow: hidden; }
  #healthFill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff5a3c, #ff8a5a); }
  #armourLine { font-size: 11px; color: #9fd8ff; margin-top: 4px; letter-spacing: 1px; }
  /* Minimap, bottom-left */
  #minimapWrap { position: absolute; left: 16px; bottom: 16px; width: 196px; height: 196px; }
  #minimap { width: 190px; height: 190px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.35);
    background: rgba(8, 12, 20, 0.55); display: block; }
  #mapLabel { text-align: center; font-size: 11px; letter-spacing: 3px; color: #ffd23e; margin-top: 2px; }
  /* Speedometer, bottom-right */
  #speedo { position: absolute; right: 18px; bottom: 18px; text-align: right;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
  #speedNum { font-size: 64px; font-weight: 900; line-height: 0.95; color: #fff; }
  #speedUnit { font-size: 15px; font-weight: 700; letter-spacing: 4px; color: #ffd23e; }
  #speedCar { font-size: 12px; letter-spacing: 2px; color: #cfe6ff; margin-top: 2px; }
  /* Banner + toast + prompt + radio, centre */
  #banner { position: absolute; top: 22%; left: 50%; transform: translateX(-50%);
    font-size: 30px; font-weight: 900; letter-spacing: 2px; color: #ffd23e;
    text-shadow: 0 0 18px rgba(255, 45, 149, 0.75), 0 2px 6px rgba(0,0,0,0.9);
    opacity: 0; transition: opacity 0.4s; white-space: nowrap; text-align: center; }
  #toast { position: absolute; bottom: 132px; left: 50%; transform: translateX(-50%);
    font-size: 15px; font-weight: 700; color: #fff; background: rgba(8,12,20,0.7);
    padding: 7px 16px; border-radius: 8px; opacity: 0; transition: opacity 0.4s; white-space: nowrap; }
  #prompt { position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%);
    font-size: 15px; font-weight: 700; color: #ffd23e; text-shadow: 0 1px 4px #000; }
  #radioBar { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 18px; align-items: center; background: rgba(8,12,20,0.62);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 9px; padding: 8px 16px;
    font-size: 13px; white-space: nowrap; }
  #radioStation { font-weight: 800; color: #ff2d95; letter-spacing: 1px; }
  #radioSong { color: #e8e8e8; }
  #radioObj { color: #ffd23e; font-weight: 700; letter-spacing: 1px; }
  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 22px; color: rgba(255,255,255,0.9); text-shadow: 0 0 4px #000; }
  /* Weapon wheel */
  #weaponWheel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(8,12,20,0.85); border: 1px solid rgba(255,210,62,0.5); border-radius: 14px;
    padding: 18px 22px; text-align: center; pointer-events: none; }
  .ww-title { font-size: 15px; font-weight: 800; letter-spacing: 3px; color: #ffd23e; margin-bottom: 10px; }
  .ww-slot { font-size: 16px; padding: 6px 26px; border-radius: 7px; color: #ddd; }
  .ww-slot.sel { background: #ffd23e; color: #111; font-weight: 800; }
  .ww-hint { font-size: 12px; color: #9fb3c8; margin-top: 10px; }
  /* Race HUD */
  #raceHud { position: absolute; top: 96px; left: 14px; display: flex; gap: 10px; }
  #raceHud span { background: rgba(8,12,20,0.62); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 8px; padding: 6px 12px; font-size: 14px; font-weight: 800; }
  #racePos { color: #ffd23e; }
  /* Start / pause screens */
  #startScreen { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    background: linear-gradient(180deg, rgba(20,16,40,0.82), rgba(60,20,40,0.72)); pointer-events: auto; }
  .ss-title { font-size: 72px; font-weight: 900; letter-spacing: 6px; color: #ffd23e;
    text-shadow: 0 0 26px rgba(255,45,149,0.8), 0 4px 10px rgba(0,0,0,0.8); }
  .ss-sub { font-size: 19px; color: #ffe9a8; letter-spacing: 1px; }
  .ss-desc { font-size: 15px; color: #dfe8f2; max-width: 560px; line-height: 1.5; }
  #startBtn, #continueBtn, #resumeBtn { pointer-events: auto; cursor: pointer;
    font-size: 20px; font-weight: 800; letter-spacing: 2px; color: #111;
    background: linear-gradient(180deg, #ffd23e, #ff9a1a); border: none; border-radius: 10px;
    padding: 14px 44px; box-shadow: 0 4px 18px rgba(255,154,26,0.5); }
  #continueBtn { background: linear-gradient(180deg, #7cfc66, #2ea84a); color: #06210c; }
  .ss-controls { font-size: 14px; color: #cfe0f0; line-height: 1.7; background: rgba(0,0,0,0.35);
    padding: 10px 22px; border-radius: 10px; }
  .ss-foot { font-size: 12px; color: #8fa3b8; }
  #pauseScreen { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: rgba(8,12,20,0.78); pointer-events: auto; }
  .ps-title { font-size: 52px; font-weight: 900; letter-spacing: 6px; }
  .ps-hint { font-size: 14px; color: #cfe0f0; }
  #missionList { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(8,12,20,0.9); border: 1px solid rgba(255,210,62,0.5); border-radius: 12px;
    padding: 16px 22px; min-width: 420px; pointer-events: none; }
  .ml-title { font-size: 16px; font-weight: 800; letter-spacing: 2px; color: #ffd23e; margin-bottom: 8px; }
  .ml-row { font-size: 13px; padding: 3px 0; color: #cfe0f0; }
  .ml-row.cur { color: #ffd23e; font-weight: 800; }
  .ml-row.done { color: #6f8296; text-decoration: line-through; }
</style>
</head>
<body>
<script type="module">
  // three.module.min.js is the full ES module build: import it once and
  // publish it as the global the rest of the game reads, before the modules
  // below run.
  import * as THREE from './vendor/three/three.module.min.js';
  window.THREE = THREE;
</script>
<script type="module" src="src/util.js"></script>
<script type="module" src="src/sound.js"></script>
<script type="module" src="src/savegame.js"></script>
<script type="module" src="src/coralcity.js"></script>
<script type="module" src="src/walk.js"></script>
<script type="module" src="src/drive.js"></script>
<script type="module" src="src/bikes.js"></script>
<script type="module" src="src/boats.js"></script>
<script type="module" src="src/cops.js"></script>
<script type="module" src="src/fight.js"></script>
<script type="module" src="src/garage.js"></script>
<script type="module" src="src/raceway.js"></script>
<script type="module" src="src/story.js"></script>
<script type="module" src="src/story2.js"></script>
<script type="module" src="src/hudkit.js"></script>
<script type="module" src="src/shots.js"></script>
<script type="module" src="src/boot.js"></script>
</body>
</html>
