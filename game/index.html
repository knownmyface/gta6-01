<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORAL HEAT — 20 story missions, casino heist, street races, garage &amp; bikes, 5-star police, helicopter chases, carjacking, boats &amp; radio in a sunset marina city</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a0b2e; font-family: Arial, Helvetica, sans-serif; }
  #game { position: relative; width: 100%; height: 100%; }
  #game canvas { display: block; }
  .hud { position: absolute; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.9); }
  .panel { position: absolute; background: rgba(8,10,22,.72); border: 1px solid rgba(255,209,102,.45); border-radius: 10px; padding: 8px 12px; }
  .mission-panel { top: 12px; left: 12px; width: 340px; }
  .mp-title { color: #ffd166; font-weight: 900; font-size: 13px; letter-spacing: 2px; }
  .mp-name { font-weight: 900; font-size: 17px; margin-top: 2px; }
  .mp-desc { font-size: 13px; color: #e8e8e8; margin-top: 3px; line-height: 1.35; }
  .mp-hint { font-size: 12px; color: #7dd3fc; margin-top: 3px; }
  .mp-obj { font-size: 12px; color: #ffd166; margin-top: 5px; font-weight: 700; }
  .top-right { top: 12px; right: 12px; text-align: right; min-width: 210px; }
  .cash { font-size: 26px; font-weight: 900; color: #7CFC00; }
  .wanted { font-size: 24px; letter-spacing: 3px; color: #888; }
  .wanted.w1, .wanted.w2 { color: #ffd166; }
  .wanted.w3, .wanted.w4 { color: #ff8844; }
  .wanted.w5 { color: #ff3333; animation: blink .5s infinite alternate; }
  @keyframes blink { from { opacity: 1; } to { opacity: .45; } }
  .wanted-label { font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #ffb3b3; }
  .health { font-size: 14px; margin-top: 3px; }
  .clock { font-size: 13px; color: #c9c9c9; }
  .minimap-wrap { left: 12px; bottom: 12px; padding: 5px; }
  .minimap { display: block; border-radius: 6px; }
  .zone { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #ffd166; text-align: center; margin-top: 4px; }
  .speed-panel { right: 12px; bottom: 12px; text-align: right; min-width: 170px; }
  .speed { font-size: 52px; font-weight: 900; line-height: 1; color: #fff; }
  .speed-unit { font-size: 13px; letter-spacing: 3px; color: #ffd166; font-weight: 800; }
  .vehicle { font-size: 12px; font-weight: 800; margin-top: 2px; color: #7dd3fc; }
  .damage, .nitro { font-size: 12px; margin-top: 2px; }
  .nitro { color: #ff2fd6; font-weight: 800; }
  .weapon-slots { left: 220px; bottom: 12px; display: flex; gap: 5px; padding: 6px; }
  .wslot { font-size: 11px; font-weight: 700; padding: 5px 7px; border-radius: 6px; background: rgba(255,255,255,.08); color: #ccc; white-space: nowrap; }
  .wslot.active { background: #ffd166; color: #111; }
  .bottom-centre { left: 50%; transform: translateX(-50%); bottom: 12px; width: 460px; text-align: center; }
  .radio { font-size: 13px; color: #f472b6; font-weight: 700; }
  .banner-title { font-size: 22px; font-weight: 900; color: #ffd166; letter-spacing: 1px; margin-top: 3px; }
  .banner-title.flash { animation: bannerpop 2.6s ease; }
  @keyframes bannerpop { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .banner-sub { font-size: 13px; color: #fff; }
  .hint-line { font-size: 12px; color: #7CFC00; margin-top: 3px; min-height: 15px; }
  .race-hud { top: 12px; left: 50%; transform: translateX(-50%); text-align: center; border-color: #00e5ff; }
  .race-name { font-size: 16px; font-weight: 900; color: #00e5ff; }
  .race-pos { font-size: 22px; font-weight: 900; }
  .race-lap, .race-time { font-size: 13px; font-weight: 700; }
  .toast-box { position: absolute; top: 150px; left: 12px; display: flex; flex-direction: column; gap: 6px; width: 340px; }
  .toast { background: rgba(8,10,22,.85); border-left: 4px solid #fff; border-radius: 6px; padding: 7px 10px; font-size: 13px; font-weight: 700; }
  .wheel { position: absolute; left: 50%; top: 50%; width: 340px; height: 340px; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(8,10,22,.6); border: 2px solid rgba(255,209,102,.6); pointer-events: auto; }
  .wheel-centre { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-weight: 900; letter-spacing: 2px; color: #ffd166; font-size: 14px; }
  .wheel-seg { position: absolute; transform: translate(-50%, -50%); background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.35); border-radius: 8px; padding: 6px 9px; font-size: 11px; font-weight: 800; cursor: pointer; white-space: nowrap; }
  .wheel-seg:hover { background: #ffd166; color: #111; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(160deg, rgba(26,11,46,.88), rgba(255,107,74,.55)); pointer-events: auto; text-align: center; padding: 20px; }
  .game-title { font-size: 84px; font-weight: 900; letter-spacing: 6px; color: #ffd166; text-shadow: 0 0 30px #ff2fd6, 0 4px 0 #7a2d00; }
  .game-sub { font-size: 17px; font-weight: 800; color: #fff; margin-top: 8px; }
  .game-sub2 { font-size: 14px; font-weight: 700; color: #7dd3fc; margin-top: 4px; }
  .controls { font-size: 14px; line-height: 1.9; color: #e8e8e8; margin-top: 22px; background: rgba(0,0,0,.4); padding: 12px 22px; border-radius: 10px; }
  .play-btn { margin-top: 22px; font-size: 20px; font-weight: 900; letter-spacing: 2px; color: #111; background: #ffd166; border: none; border-radius: 10px; padding: 14px 34px; cursor: pointer; }
  .play-btn:hover { background: #ffe08a; }
  .pause-title { font-size: 54px; font-weight: 900; letter-spacing: 6px; }
  .shop-panel { background: rgba(8,10,22,.92); justify-content: flex-start; padding-top: 60px; overflow-y: auto; }
  .shop-title { font-size: 30px; font-weight: 900; color: #ffd166; letter-spacing: 2px; }
  .shop-body { width: 640px; max-width: 92vw; margin-top: 16px; text-align: left; }
  .shop-sec { font-size: 15px; font-weight: 900; color: #7dd3fc; margin: 14px 0 6px; letter-spacing: 1px; }
  .shop-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: rgba(255,255,255,.07); border-radius: 8px; padding: 9px 12px; margin-bottom: 6px; font-size: 13px; }
  .buy-btn { background: #7CFC00; color: #111; font-weight: 900; border: none; border-radius: 7px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
  .buy-btn:disabled { background: #555; color: #aaa; cursor: default; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<div id="game"></div>
<script type="module" src="./src/boot.js"></script>
</body>
</html>
