<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORAL HEAT — 16 story missions, street races, garage &amp; bikes, 5-star police, helicopter chases, carjacking, boats &amp; radio in a sunset marina city</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a0f2e; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; }
  canvas { display: block; }
  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .panel { position: absolute; background: rgba(12, 8, 28, 0.72); border: 1px solid rgba(255, 210, 60, 0.35); border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(2px); }
  .mission { top: 14px; left: 14px; max-width: 340px; }
  .mission-title { font-size: 20px; font-weight: 900; letter-spacing: 2px; color: #ffd23c; text-shadow: 0 2px 6px #000; }
  .obj-title { font-size: 14px; font-weight: 700; color: #fff; margin-top: 4px; }
  .obj-brief { font-size: 12px; color: #ffd9a0; margin-top: 2px; line-height: 1.35; }
  .top-right { top: 14px; right: 14px; text-align: right; min-width: 210px; }
  .cash { font-size: 26px; font-weight: 900; color: #7ae0a0; text-shadow: 0 2px 4px #000; }
  .stars { font-size: 22px; letter-spacing: 3px; color: #ffd23c; margin-top: 2px; }
  .stars.hot { color: #ff2a2a; animation: pulse 0.5s infinite alternate; }
  .stars.warm { color: #ff8a3c; }
  .stars.flash { animation: pulse 0.25s 2; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.12); } }
  .hp { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11px; font-weight: 700; }
  .bar { width: 74px; height: 9px; background: #333; border-radius: 5px; overflow: hidden; }
  .fill { height: 100%; background: #2ae06a; }
  .ar-fill { background: #2a6aff; }
  .minimap-wrap { left: 14px; bottom: 14px; padding: 6px; border-radius: 50%; overflow: hidden; }
  .minimap { border-radius: 50%; display: block; }
  .speedo { right: 14px; bottom: 14px; text-align: right; min-width: 150px; }
  .speed-num { font-size: 52px; font-weight: 900; line-height: 0.9; color: #fff; text-shadow: 0 2px 8px #000; }
  .speed-unit { font-size: 12px; letter-spacing: 3px; color: #ffd23c; font-weight: 700; }
  .veh-name { font-size: 12px; color: #9ad2e8; margin-top: 4px; font-weight: 700; }
  .bottom-centre { left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 14px; align-items: center; }
  .weapons { display: flex; gap: 6px; }
  .wslot { padding: 5px 8px; border: 1px solid #555; border-radius: 6px; font-size: 11px; font-weight: 700; color: #bbb; background: rgba(0,0,0,0.4); }
  .wslot.active { border-color: #ffd23c; color: #ffd23c; background: rgba(255,210,60,0.15); }
  .radio { font-size: 12px; font-weight: 700; color: #ff8ac2; white-space: nowrap; }
  .toast { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); background: rgba(12,8,28,0.85); border: 1px solid #ffd23c; color: #fff; font-weight: 700; font-size: 15px; padding: 9px 18px; border-radius: 8px; opacity: 0; transition: opacity 0.25s; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .banner { position: absolute; left: 50%; top: 38%; transform: translateX(-50%); font-size: 34px; font-weight: 900; letter-spacing: 4px; color: #ffd23c; text-shadow: 0 3px 12px #000; }
  .race-hud { top: 110px; right: 14px; min-width: 190px; text-align: right; border-color: rgba(255,90,60,0.6); }
  .race-name { font-size: 14px; font-weight: 900; color: #ff8a5a; }
  .race-pos { font-size: 34px; font-weight: 900; color: #fff; }
  .race-lap, .race-time, .race-best { font-size: 13px; font-weight: 700; color: #ffd9a0; }
  .countdown { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); font-size: 110px; font-weight: 900; color: #ffd23c; text-shadow: 0 4px 20px #000; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: linear-gradient(180deg, rgba(26,10,50,0.88), rgba(60,16,40,0.82)); text-align: center; padding: 20px; }
  .overlay h1 { font-size: 64px; font-weight: 900; letter-spacing: 6px; color: #ffd23c; text-shadow: 0 4px 24px rgba(255,90,60,0.6); }
  .overlay .tag { font-size: 17px; color: #ffd9a0; max-width: 640px; line-height: 1.5; }
  .overlay .tag2 { font-size: 14px; color: #9ad2e8; }
  .overlay button { pointer-events: auto; cursor: pointer; font-size: 19px; font-weight: 900; padding: 14px 34px; border: none; border-radius: 10px; background: #ff5a3c; color: #fff; box-shadow: 0 4px 18px rgba(255,90,60,0.5); }
  .overlay button:hover { background: #ff7a3c; }
  .controls { font-size: 13px; color: #ccc; max-width: 620px; line-height: 1.7; }
  .save-note { font-size: 13px; color: #7ae0a0; }
  .hidden { display: none !important; }
  #garage-panel { position: fixed; z-index: 12; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 460px; max-width: 92vw; background: rgba(12,8,28,0.95); border: 2px solid #ffd23c; border-radius: 12px; padding: 18px; }
  #garage-panel h2 { color: #ffd23c; letter-spacing: 2px; font-size: 20px; }
  #garage-panel h3 { color: #ff8a5a; margin: 12px 0 6px; font-size: 14px; }
  #garage-panel .sub { color: #9ad2e8; font-size: 12px; margin: 4px 0 10px; }
  .shop-row { display: block; width: 100%; text-align: left; margin: 5px 0; padding: 9px 10px; font-size: 13px; font-weight: 700; background: rgba(255,210,60,0.12); color: #fff; border: 1px solid rgba(255,210,60,0.4); border-radius: 8px; cursor: pointer; }
  .shop-row:hover { background: rgba(255,210,60,0.28); }
  .shop-row.owned { border-color: #2ae06a; color: #7ae0a0; }
  #garage-panel .hint { font-size: 12px; color: #ccc; margin-top: 10px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<script type="module" src="./src/boot.js"></script>
</body>
</html>
